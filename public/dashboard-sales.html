<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Sales — IOMS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>

    <main class="main">
      <div class="topbar animate-in">
        <div>
          <div class="page-title">Dashboard Sales</div>
          <div class="page-subtitle">Ringkasan Sales Order milik Anda sendiri</div>
        </div>
        <div class="topbar-user">
          <div>
            <span class="name" data-user-name style="display:block; text-align:right;"></span>
            <span class="role" data-user-role></span>
          </div>
          <div class="avatar" data-user-avatar></div>
        </div>
      </div>

      <div class="stat-grid stagger" id="stat-grid"></div>

      <div class="panel animate-in">
        <h3>Sales Order saya — terbaru</h3>
        <div class="table-wrap">
          <table class="data-table" id="my-so-table">
            <thead><tr><th>No. SO</th><th>Customer</th><th>Tanggal</th><th>Status</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="form-actions" style="margin-top:16px;">
          <a class="btn primary" href="sales-order-form.html">+ Buat Sales Order</a>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data-store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard-sales.js"></script>
</body>
</html>
