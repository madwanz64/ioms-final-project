<VirtualHost *:80>
    # Hanya public/ yang bisa diakses web; app/, config/, views/, scripts/, .env tidak.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # File statis (css/js/uploads) dilayani langsung; URL lain ke front controller.
        FallbackResource /index.php
    </Directory>

    ServerSignature Off
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
