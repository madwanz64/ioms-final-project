; Konfigurasi PHP untuk container (ERR-01: error tidak pernah tampil ke user).
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off

; Upload gambar produk: aplikasi membatasi 2 MB (UPLOAD_MAX_BYTES); batas PHP sedikit di atasnya
; agar file yang terlalu besar tetap sampai ke validasi aplikasi dan mendapat pesan yang jelas.
upload_max_filesize = 3M
post_max_size = 8M

date.timezone = Asia/Jakarta

session.cookie_httponly = 1
session.use_strict_mode = 1
