# Inventory & Order Management System — Docker Compose (§5.1)
#
#   cp .env.example .env            # lalu isi DB_PASS
#   docker compose up --build -d    # app: http://localhost:8080
#   docker compose exec app composer test
#
# Nilai diambil dari .env (dibaca otomatis oleh Docker Compose). .env tidak di-commit.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?Isi DB_PASS di file .env (salin dari .env.example)}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    volumes:
      - db-data:/var/lib/mysql
      # Dijalankan otomatis SEKALI saat volume database masih kosong (schema + seed).
      - ./database/schema-and-seed.sql:/docker-entrypoint-initdb.d/01-schema-and-seed.sql:ro
    healthcheck:
      # Lewat TCP: server sementara selama inisialisasi tidak membuka TCP, jadi status
      # "healthy" baru tercapai setelah schema & seed selesai diimpor.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      # Opsional, untuk klien MySQL di host. 3307 agar tidak bentrok dengan MySQL lokal.
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ioms}
      DB_USER: root
      DB_PASS: ${DB_PASS}
      DB_TEST_NAME: ${DB_TEST_NAME:-ioms_test}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-2097152}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Gambar produk yang diunggah tetap ada walau container dibuat ulang.
      - uploads:/var/www/html/public/uploads

  # --- Pemeriksaan kualitas kode (opsional, tidak ikut `docker compose up` biasa) -------------
  #   docker compose --profile sonar up -d sonarqube        # http://localhost:9000
  #   docker compose exec app composer test:coverage && docker compose cp app:/var/www/html/build ./build
  #   docker compose --profile sonar run --rm sonar-scanner
  # Langkah lengkap: docs/quality/sonarqube.md
  sonarqube:
    image: sonarqube:community
    profiles: ["sonar"]
    environment:
      # Docker Desktop/WSL2 sering tidak mengizinkan vm.max_map_count Elasticsearch diubah;
      # pemeriksaan bootstrap dimatikan karena ini instance lokal satu node untuk analisis.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli
    profiles: ["sonar"]
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    # Dipasang di path yang SAMA dengan container app agar path di laporan coverage cocok.
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:ro
    command: ["-Dsonar.projectBaseDir=/var/www/html", "-Dsonar.working.directory=/tmp/scannerwork"]

volumes:
  db-data:
  uploads:
  sonar-data:
  sonar-extensions:
