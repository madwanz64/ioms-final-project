# Konfigurasi analisis SonarQube untuk IOMS. Dipakai service `sonar-scanner` di compose.yaml.
sonar.projectKey=ioms
sonar.projectName=IOMS - Inventory & Order Management System
sonar.sourceEncoding=UTF-8

# Kode aplikasi: PHP berlapis, template, CSS/JS frontend, konfigurasi, dan script.
sonar.sources=app,config,public,views,scripts,database
sonar.tests=tests

# Tidak dianalisis:
# - public/uploads: file unggahan pengguna (runtime), bukan kode.
# - prototype/ tidak termasuk sonar.sources: arsip prototype HTML/JS fase sebelum PHP
#   (localStorage, tanpa backend) yang tidak dijalankan aplikasi — lihat README.
sonar.exclusions=public/uploads/**

# Pengecualian aturan yang SENGAJA diambil — alasan lengkap di docs/quality/sonarqube.md.
sonar.issue.ignore.multicriteria=ctrlParams,viewLiterals,viewRequire,configRequireWeb,configRequireCli,cookieSecure
# S1172 (parameter tak terpakai) di controller: semua handler memakai kontrak seragam
#    fn(Request, ?User, array $params) yang dipanggil Router; parameter tidak bisa dihapus per method.
sonar.issue.ignore.multicriteria.ctrlParams.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.ctrlParams.resourceKey=app/Controller/**
# S1192 (literal berulang) di template: nama partial, URL menu, dan atribut " selected"
#    lebih jelas ditulis langsung di HTML daripada dipindah ke konstanta.
sonar.issue.ignore.multicriteria.viewLiterals.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.viewLiterals.resourceKey=views/**
# S2003 (require -> require_once) di View: partial yang sama dirender berulang dalam satu
#    request; require_once justru membuat render kedua kosong (bug nyata).
sonar.issue.ignore.multicriteria.viewRequire.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.viewRequire.resourceKey=app/Core/View.php
# S2003 untuk `$config = require config.php`: file konfigurasi MENGEMBALIKAN array dan tidak
#    mendefinisikan apa pun; require_once tidak relevan (autoload sudah require_once).
sonar.issue.ignore.multicriteria.configRequireWeb.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.configRequireWeb.resourceKey=public/index.php
sonar.issue.ignore.multicriteria.configRequireCli.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.configRequireCli.resourceKey=scripts/check-low-stock.php
# S2092 (cookie tanpa flag secure): flag secure diisi dinamis = true bila request HTTPS.
#    Aplikasi demo berjalan di http://localhost; memaksa secure=true membuat login tidak bisa dipakai.
sonar.issue.ignore.multicriteria.cookieSecure.ruleKey=php:S2092
sonar.issue.ignore.multicriteria.cookieSecure.resourceKey=app/Core/Session.php

# Laporan dari `composer test:coverage` (PHPUnit + PCOV di container app).
sonar.php.coverage.reportPaths=build/coverage.xml
sonar.php.tests.reportPath=build/junit.xml

# Coverage dihitung untuk kode PHP aplikasi (app/). Front controller, view, config, dan script
# CLI diverifikasi lewat smoke test HTTP & uji browser, bukan unit test.
sonar.coverage.exclusions=public/**,views/**,config/**,scripts/**,database/**
